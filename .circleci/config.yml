# CircleCI configuration for Visitor
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/openjdk:17.0

    working_directory: ~/repo

    environment:
      JVM_OPTS: -Xmx3200m
      TERM: dumb

    steps:
      - checkout

      # Restore cached dependencies
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "build.sbt" }}
            - v1-dependencies-

      # Compile
      - run:
          name: Compile
          command: cat /dev/null | sbt compile

      # Save dependency cache
      - save_cache:
          paths:
            - ~/.sbt
            - ~/.ivy2/cache
            - ~/.cache/coursier
          key: v1-dependencies-{{ checksum "build.sbt" }}

      # Run tests
      - run:
          name: Test
          command: cat /dev/null | sbt test

      # Generate scaladoc (catches doc warnings in CI)
      - run:
          name: Doc
          command: cat /dev/null | sbt doc

workflows:
  build-and-test:
    jobs:
      - build